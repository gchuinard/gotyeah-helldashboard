name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint + build (Vite/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      # Pas d'étape lint : le repo n'a pas de config ESLint 9 (eslint.config.js),
      # donc `npm run lint` échoue. Le build couvre déjà le typecheck (tsc -b).
      - name: Build (typecheck tsc + vite build)
        run: npm run build
